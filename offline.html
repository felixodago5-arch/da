<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Felix James</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
    <style>
        * { margin:0;padding:0;box-sizing:border-box; }
        body {
            font-family:'DM Sans',sans-serif;
            background:#0e1117;
            color:#e9edf2;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            gap:16px;
            text-align:center;
            padding:24px;
        }
        .icon { width:72px;
            height:72px;
            border-radius:100px;
            background:rgba(20,184,166,0.1);
            border:1px solid rgba(20,184,166,0.2);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:32px;
            margin-bottom:8px;
         }
        h1 { font-family:'Syne',sans-serif;
        font-size:22px;
        font-weight:800;
        letter-spacing:-0.4px;
     }
        h1 span { 
            color:#14b8a6; 
        }
        p { font-size:14px;
            color:#788290;
            max-width:300px;
            line-height:1.6;
         }
        .btn { margin-top:8px;
            padding:11px 24px;
            border-radius:10px;
            border:none;
            background:#14b8a6;
            color:#fff;
            font-family:'Syne',sans-serif;
            font-size:14px;font-weight:700;
            cursor:pointer;
            transition:background 0.2s;
         }
        .btn:hover { 
            background:#0d9f8f; 
        }
        .sub { font-size:12px;
            color:#5a6474;
            margin-top:4px; 
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>Felix <span>James</span></h1>
    <p>You're offline. Please check your internet connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <p class="sub">Your data will sync automatically when you're back online.</p>
</body>
</html>
